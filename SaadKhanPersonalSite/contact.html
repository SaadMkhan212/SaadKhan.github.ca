  <section class="section page-section">
    <div class="container contact-container">
      <h2 class="section-title">Contact</h2>
      <p class="contact-subtitle">Have a question or want to work together? Reach out below.</p>

      <form class="contact-form" onsubmit="handleSubmit(event)">
        <div class="form-row">
          <input type="text" name="name" placeholder="Your Name" required />
          <input type="email" name="email" placeholder="Your Email" required />
        </div>
        <input type="text" name="subject" placeholder="Subject" required />
        <textarea name="message" rows="5" placeholder="Your message..." required></textarea>
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>

      <div class="contact-links">
        <a href="mailto:khansaaf212@gmail.com">khansaaf212@gmail.com</a>
        <a href="https://github.com/" target="_blank">GitHub</a>
        <a href="https://linkedin.com/in/" target="_blank">LinkedIn</a>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2026 Saad Khan · Built with HTML, CSS & JS</p>
  </footer>

  <script src="script.js"></script>
